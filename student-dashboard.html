<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student workspace | Quizora</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="app-page dashboard-page">
    <header class="app-header"><a class="brand" href="index.html"><span class="brand-mark">Q</span> quizora</a><div class="user-menu"><span class="avatar" id="studentAvatar">A</span><span id="studentHeaderName">Student</span><a class="header-link" href="index.html">Sign out</a></div></header>
